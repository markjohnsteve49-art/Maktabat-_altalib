<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكتبة السودان</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f7f6;color:#17211d}header{background:#176b45;color:#fff;padding:18px;text-align:center}h1{margin:0 0 6px}.wrap{max-width:1050px;margin:auto;padding:20px}.card{background:#fff;border-radius:14px;padding:18px;margin:15px 0;box-shadow:0 3px 14px #0001}input,textarea,select,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:9px;border:1px solid #ccd5d0;font-size:16px}button{background:#176b45;color:#fff;border:0;cursor:pointer}.danger{background:#a72c2c}.secondary{background:#5d6863}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px}.book{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 12px #0001}.book img{width:100%;height:260px;object-fit:cover;background:#ddd}.book-body{padding:14px}.muted{color:#66736d}.hidden{display:none}.notice{padding:12px;border-radius:9px;background:#eef5f1;margin:10px 0}nav{display:flex;gap:8px;justify-content:center;margin-top:12px}nav button{width:auto;padding:9px 15px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header><h1>📚 مكتبة السودان</h1><div>كتب ومعرفة سودانية للجميع</div><nav><button onclick="show('home')">المكتبة</button><button onclick="show('login')">دخول المدير</button></nav></header>
<main class="wrap">
<section id="home"><div class="card"><input id="search" placeholder="🔎 ابحث عن كتاب أو مؤلف..." oninput="renderBooks()"><select id="category" onchange="renderBooks()"><option value="">كل التصنيفات</option></select></div><div id="status" class="notice">جاري تحميل الكتب...</div><div id="books" class="grid"></div></section>
<section id="login" class="hidden"><div class="card"><h2>🔐 دخول المدير</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button><div id="loginMsg"></div></div></section>
<section id="admin" class="hidden"><div class="card"><h2>لوحة إدارة مكتبة السودان</h2><div id="adminUser" class="muted"></div><button class="secondary" onclick="logout()">تسجيل الخروج</button></div><div class="card"><h3>➕ إضافة كتاب</h3><input id="title" placeholder="عنوان الكتاب"><input id="author" placeholder="المؤلف"><select id="bookCategory"></select><textarea id="description" placeholder="وصف مختصر للكتاب"></textarea><input id="cover" type="url" placeholder="رابط صورة الغلاف (اختياري)"><input id="file" type="url" placeholder="رابط ملف PDF (اختياري)"><label><input id="published" type="checkbox" checked> منشور للعامة</label><button onclick="addBook()">حفظ الكتاب</button><div id="adminMsg"></div></div><div class="card"><h3>📚 الكتب</h3><div id="adminBooks"></div></div></section>
</main>
<script>
const SUPABASE_URL="https://qbfwzkkhftqwkcwnzzya.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_-kpjsWJSgy8QzauMw16B1w_CShkkq7U";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let books=[],categories=[];
function show(id){['home','login','admin'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
async function load(){let c=await sb.from('categories').select('*').order('name');categories=c.data||[];let o=categories.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');document.getElementById('category').innerHTML='<option value="">كل التصنيفات</option>'+o;document.getElementById('bookCategory').innerHTML='<option value="">بدون تصنيف</option>'+o;let b=await sb.from('books').select('*, categories(name)').order('created_at',{ascending:false});if(b.error){document.getElementById('status').textContent='حدث خطأ في تحميل الكتب.';return}books=b.data||[];renderBooks()}
function renderBooks(){let q=document.getElementById('search').value.trim().toLowerCase(),cat=document.getElementById('category').value;let list=books.filter(b=>(!cat||String(b.category_id)===cat)&&((b.title+' '+b.author).toLowerCase().includes(q)));document.getElementById('status').textContent=list.length?'عدد الكتب: '+list.length:'لا توجد كتب مطابقة.';document.getElementById('books').innerHTML=list.map(b=>`<article class="book"><img src="${b.cover_path||''}" alt=""><div class="book-body"><h3>${esc(b.title)}</h3><div class="muted">✍️ ${esc(b.author)}</div><div class="muted">${esc(b.categories?.name||'')}</div>${b.description?`<p>${esc(b.description)}</p>`:''}${b.file_path?`<a href="${esc(b.file_path)}" target="_blank"><button>📖 قراءة PDF</button></a>`:''}</div></article>`).join('')}
async function login(){let r=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(r.error){document.getElementById('loginMsg').textContent='بيانات الدخول غير صحيحة أو حدث خطأ.';return}checkAdmin()}
async function checkAdmin(){let u=(await sb.auth.getUser()).data.user;if(!u){show('login');return}let r=await sb.from('admins').select('user_id').eq('user_id',u.id).maybeSingle();if(r.data){document.getElementById('adminUser').textContent='تم تسجيل الدخول كمدير';show('admin');renderAdmin()}else{await sb.auth.signOut();document.getElementById('loginMsg').textContent='هذا الحساب ليس مديرًا.';show('login')}}
async function logout(){await sb.auth.signOut();show('home')}
async function addBook(){let data={title:val('title'),author:val('author'),description:val('description')||null,category_id:val('bookCategory')?Number(val('bookCategory')):null,cover_path:val('cover')||null,file_path:val('file')||null,published:document.getElementById('published').checked};if(!data.title||!data.author){document.getElementById('adminMsg').textContent='اكتب عنوان الكتاب والمؤلف.';return}let r=await sb.from('books').insert(data);document.getElementById('adminMsg').textContent=r.error?'حدث خطأ: '+r.error.message:'تم حفظ الكتاب بنجاح ✅';if(!r.error){['title','author','description','cover','file'].forEach(id=>document.getElementById(id).value='');await load();renderAdmin()}}
async function delBook(id){if(!confirm('هل تريد حذف هذا الكتاب؟'))return;let r=await sb.from('books').delete().eq('id',id);if(r.error)alert(r.error.message);else{await load();renderAdmin()}}
function renderAdmin(){document.getElementById('adminBooks').innerHTML=books.map(b=>`<div class="notice"><b>${esc(b.title)}</b> — ${esc(b.author)} <button class="danger" onclick="delBook(${b.id})">حذف</button></div>`).join('')}
function val(id){return document.getElementById(id).value.trim()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
load();
</script></body></html>
